<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8">
        <title>Định dạng văn bản</title>
    </head>
    <body>
        <!-- Tiêu đề màu xanh dương và căn giữa -->
        <h1 style="color: blue; text-align: center;">HTML Text Formatting</h1>

        <!-- Đoạn văn bản với kích thước chữ 18px -->
        <p style="font-size: 18px;">HTML cho phép bạn định dạng văn bản một cách dễ dàng.</p>

        <!-- Thẻ định dạng chữ: in đậm, in nghiêng, gạch chân -->
        <p><b>Chữ in đậm</b>, <i>chữ in nghiêng</i>, <u>chữ gạch chân</u>.</p>

        <!-- Đoạn văn bản có màu chữ đỏ -->
        <p style="color: red;">Đoạn văn bản này có màu đỏ.</p>

        <!-- Đoạn văn bản căn giữa và đổi font chữ sang Arial -->
        <p style="text-align: center; font-family: Arial, sans-serif;">
            Đây là một đoạn văn bản căn giữa với font chữ Arial.
        </p>

        <!-- Danh sách không thứ tự có chữ màu xanh lá và in đậm toàn bộ item -->
        <ul style="color: green; font-weight: bold;">
            <li>HTML</li>
            <li>CSS</li>
            <li>JavaScript</li>
        </ul>
    </body>
</html>
