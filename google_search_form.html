<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="utf-8">
    <title>Form Tìm kiếm Google</title>
</head>
<body>

    <h2>Tìm kiếm thông tin</h2>

    <!-- Form tìm kiếm kết nối tới Google Search -->
    <form action="https://www.google.com.vn/search" method="GET">
        <input type="text" name="q" placeholder="Nhập từ khóa tìm kiếm..." size="40" required/>
        <input type="submit" value="Tìm kiếm"/>
    </form>

    <!-- Gợi ý mở rộng: Form tìm kiếm với Bing (nếu muốn thử nghiệm) -->

    </form>
    -->

</body>
</html>6
