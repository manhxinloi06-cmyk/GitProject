<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tạo liên kết trong HTML</title>
</head>
<body>

    <!-- Tiêu đề chính -->
    <h1>Liên kết yêu thích của tôi</h1>

    <!-- Danh sách không có thứ tự chứa các liên kết -->
    <ul>
        <!-- 1. Liên kết mở trong tab mới (target="_blank") -->
        <li>
            <a href="https://www.google.com" target="_blank">Google (Mở trong tab mới)</a>
        </li>

        <!-- 2. Liên kết đến trang web khác -->
        <li>
            <a href="https://github.com">Trang chủ GitHub</a>
        </li>

        <!-- 3. Liên kết đến file HTML khác trong cùng thư mục -->
        <li>
            <a href="about.html">Xem trang Giới thiệu (about.html)</a>
        </li>

        <!-- 4. Liên kết mở ứng dụng gửi email (mailto:) -->
        <li>
            <a href="mailto:emailcuaban@example.com">Gửi email cho tôi</a>
        </li>
    </ul>

</body>
</html>
