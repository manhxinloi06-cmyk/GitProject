<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Trang web của tôi</title>
    <!-- Nhúng file CSS nằm trong thư mục css -->
    <link rel="stylesheet" href="css/style3.css">
</head>
<body>

    <!-- Tiêu đề h1 (Element Selector & ID Selector) -->
    <h1 id="main-title">Trang web của tôi</h1>

    <!-- Đoạn văn mô tả bản thân (Element Selector & Class Selector) -->
    <p class="bio-text">
        Xin chào! Tôi là một học viên Frontend đang trong quá trình thực hành làm chủ HTML và các bộ chọn CSS.
    </p>

    <!-- Danh sách sở thích (Grouping & Class Selectors) -->
    <h2>Sở thích của tôi</h2>
    <ul class="hobby-list">
        <li class="hobby-item item-1">Đọc sách công nghệ</li>
        <li class="hobby-item item-2">Lập trình Web Frontend</li>
        <li class="hobby-item item-3">Chơi thể thao cuối tuần</li>
    </ul>

    <!-- Nút bấm với hiệu ứng Hover (Button & Pseudo-class :hover) -->
    <div class="action-container">
        <button id="btn-action">Nhấn vào đây</button>
    </div>

</body>
</html>
