<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Bài tập Sử dụng Box Model 1</title>
    <!-- Nhúng file style8.css nằm trong thư mục css -->
    <link rel="stylesheet" href="css/style8.css">
</head>
<body>

    <h2>So Sánh Các Giá Trị Box-Sizing Trên Card</h2>

    <!-- Thẻ 1: content-box (xanh lá) -->
    <div class="card">
        <h3>Card 1 (content-box)</h3>
        <p>Kích thước tổng bị phình to: 330px x 200px</p>
    </div>

    <!-- Thẻ 2: border-box (vàng) -->
    <div class="card">
        <h3>Card 2 (border-box)</h3>
        <p>Giữ chuẩn kích thước đã khai báo: 280px x 150px</p>
    </div>

    <!-- Thẻ 3: border-box (đỏ) -->
    <div class="card">
        <h3>Card 3 (border-box)</h3>
        <p>Giữ chuẩn kích thước đã khai báo: 280px x 150px</p>
    </div>

</body>
</html>
